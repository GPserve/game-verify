<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frog Cross Fairness Verification | GanPlay Provably Fair</title>
  <meta name="description" content="GanPlay Frog Cross Provably Fair player self-service verification. Enter Server Seed / Client Seed / Nonce / Difficulty to verify the frog and sunk pad positions of all 9 rows.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="site-title">Frog Cross Fairness Verification</h1>
      <p class="site-subtitle">GanPlay Provably Fair Player Self-Service Verification</p>
    </header>

    <main class="site-main">
      <section class="verify-card">
        <form class="verify-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="server-seed">Server Seed</label>
            <input
              class="form-input"
              type="text"
              id="server-seed"
              name="server-seed"
              placeholder="Enter the Server Seed for this round"
              autocomplete="off"
              spellcheck="false"
            >
            <span class="form-error" id="server-seed-error" hidden>Server Seed is required</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="server-seed-hash">Server Seed Hash <span class="form-label-optional">(optional)</span></label>
            <input
              class="form-input"
              type="text"
              id="server-seed-hash"
              name="server-seed-hash"
              placeholder="Enter the Server Seed Hash shown before this round"
              autocomplete="off"
              spellcheck="false"
            >
            <span class="form-hash-status" id="server-seed-hash-status" hidden></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="client-seed">Client Seed</label>
            <input
              class="form-input"
              type="text"
              id="client-seed"
              name="client-seed"
              placeholder="Enter the Client Seed for this round"
              autocomplete="off"
              spellcheck="false"
            >
            <span class="form-error" id="client-seed-error" hidden>Client Seed is required</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="nonce">Nonce</label>
            <input
              class="form-input"
              type="number"
              id="nonce"
              name="nonce"
              placeholder="Enter the round number (Nonce)"
              step="1"
              min="0"
              value="0"
            >
            <span class="form-error" id="nonce-error" hidden>Nonce is required</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="difficulty">Difficulty</label>
            <select class="form-input" id="difficulty" name="difficulty">
              <option value="Easy" selected>Easy (4 pads, 3 frogs)</option>
              <option value="Medium">Medium (3 pads, 2 frogs)</option>
              <option value="Hard">Hard (2 pads, 1 frog)</option>
              <option value="Expert">Expert (3 pads, 1 frog)</option>
              <option value="Master">Master (4 pads, 1 frog)</option>
            </select>
          </div>

          <button class="verify-button" type="submit">Verify / Calculate</button>
        </form>
      </section>

      <section class="result-card" id="result-card" hidden>
        <!-- 九排荷葉盤面，對齊後台注單明細：排 9 在最上、排 1 在最下 -->
        <div class="frog-board" id="frog-board"></div>
        <div class="frog-legend">
          <span class="frog-legend-item"><span class="frog-legend-swatch frog-legend-swatch--frog"></span>Frog (safe pad)</span>
          <span class="frog-legend-item"><span class="frog-legend-swatch frog-legend-swatch--leaf"></span>Withered leaf (trap)</span>
        </div>
        <p class="result-label result-label--spaced">Full Order per Row (row 1 to 9)</p>
        <p class="result-value result-value--compact" id="full-order-result">--</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 GanPlay. All rights reserved.</p>
    </footer>
  </div>

  <script src="assets/js/frog_cross.js"></script>
  <script>
    (() => {
      const serverSeedInput = document.getElementById("server-seed");
      const clientSeedInput = document.getElementById("client-seed");
      const nonceInput = document.getElementById("nonce");
      const difficultyInput = document.getElementById("difficulty");
      const boardEl = document.getElementById("frog-board");
      const fullOrderResultEl = document.getElementById("full-order-result");
      const resultCardEl = document.getElementById("result-card");
      const serverSeedErrorEl = document.getElementById("server-seed-error");
      const clientSeedErrorEl = document.getElementById("client-seed-error");
      const nonceErrorEl = document.getElementById("nonce-error");
      const formEl = document.querySelector(".verify-form");

      // 每次觸發計算給予遞增 token，僅套用最新一次計算結果。
      let latestToken = 0;

      const parseIntField = (rawValue, fallback) => {
        const parsed = Math.trunc(Number(rawValue));
        return Number.isFinite(parsed) ? parsed : fallback;
      };

      const hideResult = () => {
        resultCardEl.hidden = true;
        boardEl.replaceChildren();
        fullOrderResultEl.textContent = "--";
      };

      // Difficulty 為 select 天然有值，僅檢 server/client/nonce 三欄。
      const validateRequired = (serverSeed, clientSeed, nonceRaw) => {
        const serverSeedMissing = serverSeed === "";
        const clientSeedMissing = clientSeed === "";
        const nonceMissing = nonceRaw === "";

        serverSeedErrorEl.hidden = !serverSeedMissing;
        clientSeedErrorEl.hidden = !clientSeedMissing;
        nonceErrorEl.hidden = !nonceMissing;

        serverSeedInput.classList.toggle("is-invalid", serverSeedMissing);
        clientSeedInput.classList.toggle("is-invalid", clientSeedMissing);
        nonceInput.classList.toggle("is-invalid", nonceMissing);

        return !serverSeedMissing && !clientSeedMissing && !nonceMissing;
      };

      // 與 BettingRecord 序列化同形：排間 "; "、排內 ","（1-based）
      const joinRows = (rows, pick) => rows.map((r) => pick(r).join(",")).join("; ");

      // 荷葉圖示（Tabler leaf / leaf-off，與後台同款）
      const LEAF_ICON =
        '<path d="M5 21c.5 -4.5 2.5 -8 7 -10" /><path d="M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3z" />';
      const LEAF_OFF_ICON =
        '<path d="M5 21c.5 -4.5 2.5 -8 7 -10" /><path d="M7.536 7.586c-1.632 1.102 -2.522 2.82 -2.536 5.414c0 1 0 3 2 5h3c3.18 0 5.84 -.844 7.75 -2.473m1.704 -2.3c.98 -1.857 1.546 -4.191 1.546 -6.227v-2h-4.014c-2.055 0 -3.783 .209 -5.207 .609" /><path d="M3 3l18 18" />';
      const iconSvg = (paths) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

      // rows 為排 1 → 排 9；畫面由排 9 寫到排 1。每格依是否為枯葉判定青蛙／枯葉兩態
      // （驗證頁沒有玩家腳印，只呈現種子決定的盤面）。
      const renderBoard = (rows, padCount) => {
        const rowEls = rows
          .map((row, index) => {
            const rowNo = index + 1;
            const rowEl = document.createElement("div");
            rowEl.className = "frog-board-row";

            const labelEl = document.createElement("span");
            labelEl.className = "frog-board-label";
            labelEl.textContent = `Row ${rowNo}`;
            rowEl.append(labelEl);

            for (let pos = 1; pos <= padCount; pos += 1) {
              const isLeaf = row.sunk.includes(pos);
              const cellEl = document.createElement("div");
              cellEl.className = `frog-board-cell frog-board-cell--${isLeaf ? "leaf" : "frog"}`;
              cellEl.title = `Row ${rowNo}, pad ${pos}: ${isLeaf ? "withered leaf" : "frog"}`;
              cellEl.innerHTML = iconSvg(isLeaf ? LEAF_OFF_ICON : LEAF_ICON);
              rowEl.append(cellEl);
            }
            return rowEl;
          })
          .reverse();
        boardEl.replaceChildren(...rowEls);
      };

      const recompute = async () => {
        const serverSeed = serverSeedInput.value;
        const clientSeed = clientSeedInput.value;
        const nonceRaw = nonceInput.value;

        if (!validateRequired(serverSeed, clientSeed, nonceRaw)) {
          hideResult();
          return;
        }

        const token = ++latestToken;
        const nonce = parseIntField(nonceRaw, 0);
        const difficulty = difficultyInput.value;

        const { rows, padCount } = await GanFrogCross.computeFrogCrossResult(
          serverSeed,
          clientSeed,
          nonce,
          difficulty,
        );

        if (token !== latestToken) return;
        renderBoard(rows, padCount);
        fullOrderResultEl.textContent = joinRows(rows, (r) => r.fullOrder);
        resultCardEl.hidden = false;
      };

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        recompute();
      });
    })();
  </script>
  <script src="assets/js/seed_hash.js"></script>
</body>
</html>
