<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niu Niu Fairness Verification | GanPlay Provably Fair</title>
  <meta name="description" content="GanPlay Niu Niu Provably Fair player self-service verification. Enter Server Seed / Client Seed / Nonce to rebuild the player and banker hands of the round.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="site-title">Niu Niu Fairness Verification</h1>
      <p class="site-subtitle">GanPlay Provably Fair Player Self-Service Verification</p>
    </header>

    <main class="site-main">
      <section class="verify-card">
        <form class="verify-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="server-seed">Server Seed</label>
            <input
              class="form-input"
              type="text"
              id="server-seed"
              name="server-seed"
              placeholder="Enter the Server Seed for this round"
              autocomplete="off"
              spellcheck="false"
            >
            <span class="form-error" id="server-seed-error" hidden>Server Seed is required</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="client-seed">Client Seed</label>
            <input
              class="form-input"
              type="text"
              id="client-seed"
              name="client-seed"
              placeholder="Enter the Client Seed for this round"
              autocomplete="off"
              spellcheck="false"
            >
            <span class="form-error" id="client-seed-error" hidden>Client Seed is required</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="nonce">Nonce</label>
            <input
              class="form-input"
              type="number"
              id="nonce"
              name="nonce"
              placeholder="Enter the round number (Nonce)"
              step="1"
              min="0"
              value="0"
            >
            <span class="form-error" id="nonce-error" hidden>Nonce is required</span>
          </div>

          <button class="verify-button" type="submit">Verify / Calculate</button>
        </form>
      </section>

      <section class="result-card" id="result-card" hidden>
        <p class="result-label">Player (cards 1-5, bull cards outlined)</p>
        <div class="card-grid" id="player-grid"></div>
        <p class="result-value" id="player-level">--</p>
        <p class="result-label">Banker (cards 6-10, bull cards outlined)</p>
        <div class="card-grid" id="banker-grid"></div>
        <p class="result-value" id="banker-level">--</p>
        <p class="result-label">Result</p>
        <p class="result-value" id="winner-result">--</p>
      </section>
    </main>

    </main>

    <footer class="site-footer">
      <p>&copy; 2026 GanPlay. All rights reserved.</p>
    </footer>
  </div>

    <script src="assets/js/card_shuffle.js"></script>
  <script src="assets/js/niu_niu.js"></script>
  <script>
    (() => {
      const serverSeedInput = document.getElementById("server-seed");
      const clientSeedInput = document.getElementById("client-seed");
      const nonceInput = document.getElementById("nonce");
      const cardGridEl = document.getElementById("card-grid");
      const resultCardEl = document.getElementById("result-card");
      const serverSeedErrorEl = document.getElementById("server-seed-error");
      const clientSeedErrorEl = document.getElementById("client-seed-error");
      const nonceErrorEl = document.getElementById("nonce-error");
      const formEl = document.querySelector(".verify-form");

      // 每次觸發計算給予遞增 token，僅套用最新一次計算結果，
      // 避免快速連續送出時較舊的非同步計算覆蓋較新的結果。
      let latestToken = 0;

      const parseNonce = (rawValue) => {
        const parsed = Math.trunc(Number(rawValue));
        return Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
      };

      const hideResult = () => {
        resultCardEl.hidden = true;
        if (cardGridEl) cardGridEl.replaceChildren();
      };

      const validateRequired = (serverSeed, clientSeed, nonceRaw) => {
        const serverSeedMissing = serverSeed === "";
        const clientSeedMissing = clientSeed === "";
        const nonceMissing = nonceRaw === "";

        serverSeedErrorEl.hidden = !serverSeedMissing;
        clientSeedErrorEl.hidden = !clientSeedMissing;
        nonceErrorEl.hidden = !nonceMissing;

        serverSeedInput.classList.toggle("is-invalid", serverSeedMissing);
        clientSeedInput.classList.toggle("is-invalid", clientSeedMissing);
        nonceInput.classList.toggle("is-invalid", nonceMissing);

        return !serverSeedMissing && !clientSeedMissing && !nonceMissing;
      };

      const BASIS_LABELS = { niu_level: "by hand", top_card: "by highest card", suit: "by suit of highest card" };
      const recompute = async () => {
        const serverSeed = serverSeedInput.value;
        const clientSeed = clientSeedInput.value;
        const nonceRaw = nonceInput.value;
        if (!validateRequired(serverSeed, clientSeed, nonceRaw)) {
          hideResult();
          return;
        }
        const token = ++latestToken;
        const nonce = parseNonce(nonceRaw);
        // 抽 10 張：前 5 張是玩家、第 6～10 張是莊家。
        const cards = await GanCardShuffle.draw(serverSeed, clientSeed, nonce, 10);
        if (token !== latestToken) return;
        const player = cards.slice(0, 5);
        const banker = cards.slice(5);
        const show = (hand, gridId, levelId) => {
          const g = GanNiuNiu.grouping(hand);
          document.getElementById(gridId).replaceChildren(
            ...hand.map((c, i) => GanCardShuffle.renderCard(c, undefined, g.used.includes(i))),
          );
          document.getElementById(levelId).textContent = GanNiuNiu.levelLabel(g.level);
        };
        show(player, "player-grid", "player-level");
        show(banker, "banker-grid", "banker-level");
        const r = GanNiuNiu.compare(player, banker);
        document.getElementById("winner-result").textContent =
          `${r.winner === "player" ? "Player" : "Banker"} wins (${BASIS_LABELS[r.basis]})`;
        resultCardEl.hidden = false;
      };

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        recompute();
      });
    })();
  </script>
</body>
</html>
